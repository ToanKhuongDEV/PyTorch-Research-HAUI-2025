<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Thống Kê Sản Xuất</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <div class="logo-text">
                    <h1>Hệ Thống Nhận Diện Khuyết Tật Kim Loại</h1>
                    <p>Industrial Metal Surface Defect Detection System</p>
                </div>
            </div>
        </div>
    </header>

    <div class="nav-bar">
        <button class="nav-button" onclick="location.href='photo.html'">Chụp Ảnh</button>
        <button class="nav-button" onclick="location.href='video.html'">Video Realtime</button>
        <button class="nav-button active">Thống Kê</button>
    </div>
    
    <main class="main-container" style="display: block; overflow-y: auto;">
        
        <div class="d-flex justify-content-between align-items-center mb-4" style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
            <div style="display: flex; gap: 10px;">
                <select class="select" id="timeFilter">
                    <option value="today">Hôm nay</option>
                    <option value="week">Tuần này</option>
                    <option value="month">Tháng này</option>
                </select>
                <button class="btn btn-default" id="refreshBtn"><i class="fas fa-sync"></i> Làm mới</button>
            </div>
            <button class="btn btn-outline" onclick="exportToCSV()"><i class="fas fa-file-export"></i> Xuất Excel</button>
        </div>

        <div class="dashboard-grid">
            <div class="kpi-card">
                <div>
                    <div class="kpi-title">Tổng Kiểm Tra</div>
                    <div class="kpi-value" id="kpi-total">0</div>
                </div>
                <i class="fas fa-cubes kpi-icon"></i>
            </div>
            <div class="kpi-card">
                <div>
                    <div class="kpi-title">Tỷ Lệ Lỗi</div>
                    <div class="kpi-value" id="kpi-rate" style="color: #e74c3c;">0%</div>
                </div>
                <i class="fas fa-exclamation-triangle kpi-icon"></i>
            </div>
            <div class="kpi-card">
                <div>
                    <div class="kpi-title">Sản Phẩm Đạt (OK)</div>
                    <div class="kpi-value" id="kpi-ok" style="color: #10b981;">0</div>
                </div>
                <i class="fas fa-check-circle kpi-icon"></i>
            </div>
            <div class="kpi-card">
                <div>
                    <div class="kpi-title">Tốc Độ Xử Lý TB</div>
                    <div class="kpi-value" id="kpi-time">0 ms</div>
                </div>
                <i class="fas fa-stopwatch kpi-icon"></i>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h3 style="margin-bottom: 1rem;">Xu Hướng Phát Hiện Lỗi</h3>
                <canvas id="trendChart"></canvas>
            </div>
            <div class="chart-container">
                <h3 style="margin-bottom: 1rem;">Phân Bố Loại Lỗi</h3>
            <div class="chart-wrapper">
                <canvas id="pieChart"></canvas>
            </div>
            </div>
        </div>

        <div class="data-table-container">
            <div style="padding: 1rem; border-bottom: 1px solid var(--border);">
                <h3 style="margin: 0;">Lịch Sử Quét Gần Nhất</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Thời Gian</th>
                        <th>Trạng Thái</th>
                        <th>Loại Lỗi</th>
                        <th>Độ Tin Cậy</th>
                        <th>Thời gian xử lý</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
        <div style="height: 50px;"></div>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
