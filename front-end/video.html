<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Feed - Defect Detection System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-industry"></i></div> 
                <div class="logo-text">
                    <h1>Defect Detection System</h1>
                    <p>Industrial Metal Surface Defect Detection</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggleBtn" title="Toggle Light/Dark Theme">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </div>
    </header>

    
    <main class="main-container">
        <nav class="nav-column">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-bars"></i> Menu</h2>
                </div>
                <div class="card-content" style="padding: 0.5rem; gap: 0.5rem; display: flex; flex-direction: column;">
                    <button class="nav-button" onclick="location.href='photo.html'">
                        <i class="fas fa-camera"></i> Snapshot
                    </button>
                    <button class="nav-button active" onclick="location.href='video.html'">
                        <i class="fas fa-video"></i> Live Feed
                    </button>
                    <button class="nav-button" onclick="location.href='dashboard.html'">
                        <i class="fas fa-chart-bar"></i> Analytics
                    </button>
                </div>
            </div>
        </nav>

        <div class="center-column">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-video"></i> Real-time Camera Feed</h2>
                </div>
                <div class="card-content">
                    <div class="camera-controls">
                        <select class="select" id="cameraSelect">
                            <option value="">Select Camera</option>
                        </select>
                        <div style="display:flex; align-items:center; gap:5px;">
                            <i class="fas fa-search-plus" title="Zoom (Crop Black Borders)" style="color:var(--secondary-foreground)"></i>
                            <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1" style="width:70px;">
                        </div>
                        <button class="btn btn-default" id="start-video">
                            <i class="fas fa-play"></i> Start
                        </button>
                        <button class="btn btn-destructive" id="stop-video" disabled>
                            <i class="fas fa-stop"></i> Stop
                        </button>
                    </div>

                    <div class="video-container" style="position: relative; flex: 1; background: #000;">
                        <div class="video-placeholder" id="placeholder">
                            <i class="fas fa-video"></i>
                            <p>Camera not started</p>
                        </div>
                        
                        <div id="video-display" style="width: 100%; height: 100%;"></div>
                        
                        <div class="video-overlay" id="videoOverlay">
                            <!-- <div class="grid-overlay">
                                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                            </div>
                            <div class="crosshair"></div> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="right-column">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-server"></i> Status</h2>
                </div>
                <div class="card-content" style="padding: 0rem 1rem">
                    <div class="status-container">
                        <div class="info-row">
                            <span>Camera</span>
                            <span class="badge badge-destructive" id="status-cam">Off</span>
                        </div>
                        <div class="info-row">
                            <span>FPS</span>
                            <span class="badge badge-outline" id="status-fps">0</span>
                        </div>
                        <div class="info-row">
                            <span>Total Defects</span>
                            <span class="badge badge-destructive" id="status-objects">0</span>
                        </div>
                        <div class="info-row">
                            <span>Last Status</span>
                            <span class="badge badge-outline" id="status-last-defect">---</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-history"></i> Defect Log</h2>
                    <button class="btn btn-outline btn-sm" onclick="resetServerCount()" title="Refresh">
                        <i class="fas fa-sync"></i>
                    </button>
                </div>
                <div class="card-content" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                    <div class="images-container">
                        <div id="log-container" class="image-list">
                            <div class="empty-state">
                                <i class="fas fa-clipboard-list"></i>
                                <p>No detection data</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <canvas id="snapshot-preview" class="hidden"></canvas>

    <script src="js/core.js"></script>
    <script src="js/camera-lib.js"></script>
    <script src="js/page-video.js"></script>
</body>
</html>
